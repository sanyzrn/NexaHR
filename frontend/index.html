<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NexaHR — سامانه ارزیابی عملکرد سازمانی؛ مدیریت زنجیره تأیید ارزیابی پیش از تمدید قرارداد" />
    <!-- رنگ پوستهٔ مرورگر و آیکن باید همان قرمز برند باشد؛ فیروزه‌ای/بنفشِ
         قبلی از قالب اولیه مانده بود و با هیچ‌جای محصول نمی‌خواند. -->
    <meta name="theme-color" content="#b61615" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23db1a18'/%3E%3Cstop offset='1' stop-color='%23760f0f'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='7' fill='url(%23g)'/%3E%3Cpath d='M5 17h5l2.5-7 5 12 3-8.5 1.5 3.5h5' fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <!-- PWA (P2-04): قابل نصب روی موبایل، تا مسئول واحدِ سرِ خط تولید و
         مدیری که بین دو جلسه است مجبور نباشند نشانی را به خاطر بسپارند. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="NexaHR" />
    <title>NexaHR — سامانه ارزیابی عملکرد</title>
    <!-- تم پیش از اولین رنگ‌آمیزی. فایلِ جدا و نه درون‌خطی: CSPِ استقرارِ
         nginx `script-src` جدا ندارد و از `default-src 'self'` ارث می‌برد، پس
         اسکریپتِ درون‌خطی اجرا نمی‌شد — «پرش»ی که این بلوک حلش می‌کرد، در
         محیطِ واقعی سرِ جایش بود و در `npm run dev` (بی CSP) دیده نمی‌شد.
         بی `defer` تا پیش از رنگ‌آمیزی اجرا شود. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
