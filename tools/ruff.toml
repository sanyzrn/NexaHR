# همان قواعدی که `backend/pyproject.toml` دارد، برای درختی که زیرِ آن نیست.
#
# ruff پیکربندی را با بالا رفتن از کنارِ هر فایل پیدا می‌کند، و `tools/` بیرونِ
# `backend/` است — بدونِ این فایل، کدِ راه‌انداز اصلاً لینت نمی‌شد.
line-length = 120
target-version = "py311"

[lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = [
    # UP042 می‌گوید به‌جای `str, Enum` از `StrEnum` استفاده کن. این‌جا عمداً نه:
    # `StrEnum` از پایتون ۳٫۱۱ هست، و راه‌انداز باید روی مفسرِ *قدیمی‌تر* هم
    # import شود تا بتواند پیامِ «پایتونت قدیمی است» را نشان دهد. اگر خودش موقعِ
    # import بشکند، کاربر به‌جای آن پیام یک traceback می‌گیرد.
    "UP042",
]
