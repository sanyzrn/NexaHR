name: CI

on:
  push:
    branches: [main]
    # تغییرِ فقط-مستندات، کل CI را روشن می‌کرد. سوئیت بک‌اند حدود ۵ دقیقه طول
    # می‌کشد و یک ویرایش در README هیچ‌کدامش را لازم ندارد.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"

# بزرگ‌ترین صرفه‌جویی، و دلیلش هم ساده است: هر push روی یک شاخه، اجرای قبلیِ
# همان شاخه را *لغو نمی‌کرد*. یعنی سه بار push پشت سر هم یعنی سه اجرای کامل که
# دو تایش نتیجه‌اش را کسی نمی‌بیند و همچنان دقیقه می‌سوزاند.
#
# `main` عمداً استثناست: آن‌جا هر کامیت باید نتیجهٔ خودش را داشته باشد، وگرنه
# تاریخچهٔ سبز/قرمز شاخهٔ اصلی سوراخ می‌شود.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexahr
          POSTGRES_PASSWORD: nexahr_dev_password
          POSTGRES_DB: nexahr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexahr -d nexahr_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://nexahr:nexahr_dev_password@localhost:5432/nexahr_test
      ENVIRONMENT: development
      JWT_SECRET_KEY: ci-test-secret-key-not-for-production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          # بدون کش، هر اجرا کل وابستگی‌ها را دوباره دانلود و بیلد می‌کرد —
          # psycopg و weasyprint و argon2-cffi سبک نیستند.
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  # راه‌اندازِ محیطِ توسعه. فقط کتابخانهٔ استاندارد لازم دارد — نه venv، نه
  # دیتابیس — چون خودش همان‌هاست که می‌سازد. تست‌هایش رفتارِ ویندوز را شبیه‌سازی
  # می‌کنند (خروجیِ netstat و netsh)، و همین باعث می‌شود روی رانرِ لینوکسی هم
  # معنا داشته باشند.
  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install pytest ruff
      - run: ruff check tools
      - run: python -m pytest tools/tests -q

  # سناریوی سرتسری، فقط نیمهٔ APIاش.
  #
  # این سوئیت `mock_llm.py` دارد و از ابتدا قابلِ اجرای بی‌سر بود، ولی هیچ‌جای
  # CI وصل نبود — یعنی تنها تستی که *کلِ* مسیرِ همکار را از ورود تا اجرای ابزار
  # می‌رود، فقط دستی اجرا می‌شد. مسیرِ مرورگر عمداً بیرون می‌ماند (Chromium و
  # زمانِ اجرا)، ولی نیمهٔ API نه سرویسِ بیرونی می‌خواهد و نه vite.
  e2e-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexahr
          POSTGRES_PASSWORD: nexahr_dev_password
          POSTGRES_DB: nexahr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexahr -d nexahr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://nexahr:nexahr_dev_password@localhost:5432/nexahr
      ENVIRONMENT: development
      JWT_SECRET_KEY: ci-test-secret-key-not-for-production
      ENABLE_SCHEDULER: "false"
      BOOTSTRAP_ADMIN: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - run: alembic upgrade head
        working-directory: backend
      - run: python3 e2e/setup_e2e.py
      - run: bash e2e/run_e2e.sh --api-only

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
